name: ${CONTAINER_NAME:-clawkit}

services:
  openclaw:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: "${CONTAINER_NAME:-clawkit}"
    pull_policy: always
    ports:
      - "127.0.0.1:${PORT}:18789"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - node-home:/home/node
      - linuxbrew-prefix:/home/linuxbrew/.linuxbrew

volumes:
  node-home:
    name: ${CONTAINER_NAME:-clawkit}-node-home
  linuxbrew-prefix:
    name: ${CONTAINER_NAME:-clawkit}-linuxbrew-prefix
