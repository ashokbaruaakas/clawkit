services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: "${CONTAINER_NAME}-tailscale"
    hostname: "${TAILSCALE_HOSTNAME:-${CONTAINER_NAME}-ts}"
    network_mode: service:openclaw
    depends_on:
      - openclaw
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY must be set in .env to use Tailscale}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=${TS_ACCEPT_DNS:-false}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

volumes:
  tailscale-state:
    name: openclaw-tailscale-state
