name: Check Upstream and Release

on:
  schedule:
    - cron: '0 0 * * *'          # daily at midnight UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build & release even if upstream is unchanged'
        required: false
        type: boolean
        default: false
      release_type:
        description: 'Type of change (affects release notes)'
        required: false
        type: choice
        options:
          - auto
          - code_update
          - emergency
        default: auto

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      version: ${{ steps.version.outputs.version }}
      current_digest: ${{ steps.check.outputs.current_digest }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      prev_digest: ${{ steps.decide.outputs.prev_digest }}
      prev_version: ${{ steps.decide.outputs.prev_version }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream info
        id: check
        run: |
          # -- Docker Hub API with auth and retry --
          TOKEN=$(curl -sf "https://auth.docker.io/token?service=registry.docker.io&scope=repository:alpine/openclaw:pull" \
            | jq -r '.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "WARNING: Failed to get Docker Hub auth token, falling back to anonymous"
            AUTH_HEADER=""
          else
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi

          MAX_ATTEMPTS=3
          DELAY=5

          # -- Fetch latest tag info with retry --
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if [ -n "$AUTH_HEADER" ]; then
              latest=$(curl -sf -H "$AUTH_HEADER" \
                "https://hub.docker.com/v2/repositories/alpine/openclaw/tags/latest")
            else
              latest=$(curl -sf "https://hub.docker.com/v2/repositories/alpine/openclaw/tags/latest")
            fi
            current_digest=$(echo "$latest" | jq -r '.digest // empty')
            [ -n "$current_digest" ] && break
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done

          if [ -z "$current_digest" ]; then
            echo "ERROR: Failed to fetch upstream digest after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          echo "current_digest=$current_digest" >> "$GITHUB_OUTPUT"

          # -- Fetch tags list to find the most recent stable version --
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if [ -n "$AUTH_HEADER" ]; then
              tags=$(curl -sf -H "$AUTH_HEADER" \
                "https://hub.docker.com/v2/repositories/alpine/openclaw/tags?page_size=20")
            else
              tags=$(curl -sf "https://hub.docker.com/v2/repositories/alpine/openclaw/tags?page_size=20")
            fi
            upstream_version=$(echo "$tags" | jq -r \
              '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag_last_pushed) | last | .name // empty')
            [ -n "$upstream_version" ] && break
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done

          # Fallback: use last_updated date if no stable version tag found
          if [ -z "$upstream_version" ]; then
            echo "WARNING: No stable version tag found, using tag_last_pushed date"
            upstream_version=$(echo "$latest" | jq -r '.tag_last_pushed[0:10] // "unknown"')
          fi
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: Write current upstream state (unconditional)
        run: |
          jq -n \
            --arg digest "${{ steps.check.outputs.current_digest }}" \
            --arg version "${{ steps.check.outputs.upstream_version }}" \
            '{digest: $digest, version: $version}' \
            > /tmp/upstream-state.json

      - name: Restore cached upstream state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state

      - name: Decide whether to proceed
        id: decide
        run: |
          current_digest="${{ steps.check.outputs.current_digest }}"
          force="${{ github.event.inputs.force_release == 'true' && 'true' || 'false' }}"

          # Restore previous state from cache (may have been overwritten by the unconditional write)
          if [ -f /tmp/upstream-state.json ]; then
            # Read cached values (these are the last known good state)
            cached_digest=$(jq -r '.digest' /tmp/upstream-state.json)
            cached_version=$(jq -r '.version' /tmp/upstream-state.json)
          fi

          # Now overwrite with CURRENT state for the decision logic
          jq -n \
            --arg digest "$current_digest" \
            --arg version "${{ steps.check.outputs.upstream_version }}" \
            '{digest: $digest, version: $version}' \
            > /tmp/upstream-state.json

          # Set previous values from the restored cache
          if [ -n "$cached_digest" ]; then
            echo "prev_digest=$cached_digest" >> "$GITHUB_OUTPUT"
            echo "prev_version=$cached_version" >> "$GITHUB_OUTPUT"
          fi

          # Force release -> always proceed
          if [ "$force" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=force" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First run (no cache) -> proceed
          if [ -z "$cached_digest" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=first_run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare digests
          if [ "$current_digest" = "$cached_digest" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=unchanged" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged ($current_digest). No release needed."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=updated" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        id: version
        if: steps.decide.outputs.proceed == 'true'
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          major=$(echo "$latest_tag" | cut -d. -f1 | tr -d v)
          minor=$(echo "$latest_tag" | cut -d. -f2)
          patch=$(echo "$latest_tag" | cut -d. -f3)
          new_patch=$((patch + 1))
          echo "version=v${major}.${minor}.${new_patch}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:openclaw-${{ steps.check.outputs.upstream_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            openclaw.version=${{ steps.check.outputs.upstream_version }}
            openclaw.digest=${{ steps.check.outputs.current_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: steps.decide.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag '$TAG' already exists"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          UPSTREAM="${{ steps.check.outputs.upstream_version }}"
          DIGEST="${{ steps.check.outputs.current_digest }}"
          PREV_VERSION="${{ steps.decide.outputs.prev_version }}"
          PREV_DIGEST="${{ steps.decide.outputs.prev_digest }}"
          REASON="${{ steps.decide.outputs.reason }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'auto' }}"

          # Truncate digests for display
          SHORT_DIGEST=$(echo "$DIGEST" | head -c 19)
          SHORT_PREV=$(echo "$PREV_DIGEST" | head -c 19)

          # -- Build release notes --

          # Scheduled auto-run: upstream changed
          if [ "$REASON" = "updated" ]; then
            if [ -n "$PREV_VERSION" ]; then
              NOTES="## What's Changed

**OpenClaw upstream updated** \`${PREV_VERSION}\` -> \`${UPSTREAM}\`
  Digest: \`${SHORT_PREV}...\` -> \`${SHORT_DIGEST}...\`

**Clawkit image** \`${VERSION}\` based on \`alpine/openclaw:${UPSTREAM}\`

_Auto-generated by clawkit release workflow_"
            else
              NOTES="## What's Changed

**OpenClaw upstream updated** -> \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)

**Clawkit image** \`${VERSION}\` based on \`alpine/openclaw:${UPSTREAM}\`

_Auto-generated by clawkit release workflow_"
            fi

          # First run (no cache)
          elif [ "$REASON" = "first_run" ]; then
            NOTES="## What's Changed

**Initial clawkit release** based on OpenClaw \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)

**Clawkit image** \`${VERSION}\` with Linuxbrew + development tools

_Auto-generated by clawkit release workflow_"

          # Force release (manual trigger)
          else
            case "$RELEASE_TYPE" in
              code_update)
                NOTES="## What's Changed

**Clawkit code update** -- \`${VERSION}\`
  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)

_Triggered manually | Auto-generated by clawkit release workflow_"
                ;;
              emergency)
                NOTES="## What's Changed

**Emergency release** -- \`${VERSION}\`
  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)

_Triggered manually | Auto-generated by clawkit release workflow_"
                ;;
              *)
                NOTES="## What's Changed

**Manual force release** -- \`${VERSION}\`
  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)
  - No upstream change detected -- release was forced

_Auto-generated by clawkit release workflow_"
                ;;
            esac
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"

      - name: Save upstream state to cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state