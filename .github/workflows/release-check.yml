name: Check Upstream and Release

on:
  schedule:
    - cron: '0 0 * * *'          # daily at midnight UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build & release even if upstream is unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      version: ${{ steps.version.outputs.version }}
      current_digest: ${{ steps.check.outputs.current_digest }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      prev_digest: ${{ steps.decide.outputs.prev_digest }}
      prev_version: ${{ steps.decide.outputs.prev_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream info
        id: check
        run: |
          # Fetch latest tag info from Docker Hub API
          latest=$(curl -s https://hub.docker.com/v2/repositories/alpine/openclaw/tags/latest)
          current_digest=$(echo "$latest" | jq -r '.digest')
          echo "current_digest=$current_digest" >> "$GITHUB_OUTPUT"

          # Fetch tags list to find the most recent stable version
          tags=$(curl -s "https://hub.docker.com/v2/repositories/alpine/openclaw/tags?page_size=20")
          # Most recent tag matching ^\d+\.\d+\.\d+$ (no -alpha, -beta, -slim)
          upstream_version=$(echo "$tags" | jq -r \
            '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag_last_pushed) | last | .name // empty'
          )
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: Restore cached upstream state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state

      - name: Decide whether to proceed
        id: decide
        run: |
          current_digest="${{ steps.check.outputs.current_digest }}"
          force="${{ github.event.inputs.force_release == 'true' && 'true' || 'false' }}"

          # Restore previous state if cache was hit
          if [ -f /tmp/upstream-state.json ]; then
            prev_digest=$(jq -r '.digest' /tmp/upstream-state.json)
            prev_version=$(jq -r '.version' /tmp/upstream-state.json)
            echo "prev_digest=$prev_digest" >> "$GITHUB_OUTPUT"
            echo "prev_version=$prev_version" >> "$GITHUB_OUTPUT"
          fi

          # Force release → always proceed
          if [ "$force" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=force" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First run (no cache) → proceed
          if [ ! -f /tmp/upstream-state.json ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=first_run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare digests
          if [ "$current_digest" = "$prev_digest" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=unchanged" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged ($current_digest). No release needed."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=updated" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        id: version
        if: steps.decide.outputs.proceed == 'true'
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          major=$(echo "$latest_tag" | cut -d. -f1 | tr -d v)
          minor=$(echo "$latest_tag" | cut -d. -f2)
          patch=$(echo "$latest_tag" | cut -d. -f3)
          new_patch=$((patch + 1))
          echo "version=v${major}.${minor}.${new_patch}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            openclaw.version=${{ steps.check.outputs.upstream_version }}
            openclaw.digest=${{ steps.check.outputs.current_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: steps.decide.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag '$TAG' already exists"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          UPSTREAM="${{ steps.check.outputs.upstream_version }}"
          DIGEST="${{ steps.check.outputs.current_digest }}"
          PREV_VERSION="${{ steps.decide.outputs.prev_version }}"
          PREV_DIGEST="${{ steps.decide.outputs.prev_digest }}"
          REASON="${{ steps.decide.outputs.reason }}"

          if [ "$REASON" = "force" ]; then
            NOTES="## What's Changed

          🔧 **Manual force release**
          - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`$(echo "$DIGEST" | head -c 19)…\`)
          - No upstream change detected — release was forced

          _Auto-generated by clawkit release workflow_"

          elif [ "$REASON" = "first_run" ]; then
            NOTES="## What's Changed

          ⚡ **OpenClaw upstream** \`${UPSTREAM}\` (digest: \`$(echo "$DIGEST" | head -c 19)…\`)

          🔧 Initial clawkit image \`${VERSION}\` based on \`alpine/openclaw:${UPSTREAM}\`

          _Auto-generated by clawkit release workflow_"

          else
            # Normal update — show old → new
            if [ -n "$PREV_VERSION" ]; then
              NOTES="## What's Changed

          ⚡ **OpenClaw upstream updated** \`${PREV_VERSION}\` → \`${UPSTREAM}\`
            Digest: \`$(echo "$PREV_DIGEST" | head -c 19)…\` → \`$(echo "$DIGEST" | head -c 19)…\`

          🔧 Clawkit image \`${VERSION}\` based on \`alpine/openclaw:${UPSTREAM}\`

          _Auto-generated by clawkit release workflow_"
            else
              NOTES="## What's Changed

          ⚡ **OpenClaw upstream updated** → \`${UPSTREAM}\` (digest: \`$(echo "$DIGEST" | head -c 19)…\`)

          🔧 Clawkit image \`${VERSION}\` based on \`alpine/openclaw:${UPSTREAM}\`

          _Auto-generated by clawkit release workflow_"
            fi
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"

      - name: Write upstream state
        if: steps.decide.outputs.proceed == 'true'
        run: |
          jq -n \
            --arg digest "${{ steps.check.outputs.current_digest }}" \
            --arg version "${{ steps.check.outputs.upstream_version }}" \
            '{digest: $digest, version: $version}' \
            > /tmp/upstream-state.json

      - name: Save upstream state to cache
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state