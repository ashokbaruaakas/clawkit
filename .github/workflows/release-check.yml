name: Check Upstream and Release

on:
  schedule:
    - cron: '0 0 * * *'          # daily at midnight UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build & release even if upstream is unchanged'
        required: false
        type: boolean
        default: false
      release_type:
        description: 'Type of change (affects release notes)'
        required: false
        type: choice
        options:
          - auto
          - code_update
          - emergency
        default: auto

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      version: ${{ steps.version.outputs.version }}
      current_digest: ${{ steps.check.outputs.current_digest }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      prev_digest: ${{ steps.decide.outputs.prev_digest }}
      prev_version: ${{ steps.decide.outputs.prev_version }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream info
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_ATTEMPTS=3
          DELAY=5
          current_digest=""
          upstream_version=""
          upstream_image=""

          echo "::group::Fetch latest stable OpenClaw version"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            upstream_version=""
            page=1
            MAX_TAG_PAGES=10 # 10 * 100 = 1000 tags max scanned to find the latest stable tag
            while [ "$page" -le "$MAX_TAG_PAGES" ]; do
              TAGS_RESP=$(curl -fsSL --max-time 15 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/openclaw/openclaw/tags?per_page=100&page=${page}" 2>&1) || true
              if [ -z "$TAGS_RESP" ]; then
                echo "  WARNING: GitHub tags API returned an empty response"
                break
              fi

              upstream_version=$(echo "$TAGS_RESP" | jq -r \
                '.[] | .name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")' 2>/dev/null | head -n1 || echo "")
              if [ -n "$upstream_version" ]; then
                echo "  Found stable version on page $page: $upstream_version"
                break
              fi

              TAG_COUNT=$(echo "$TAGS_RESP" | jq 'length' 2>/dev/null || echo 0)
              if [ "$TAG_COUNT" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
            if [ -n "$upstream_version" ]; then
              echo "  Found upstream version: $upstream_version"
              break
            fi
            echo "  WARNING: No version tag found in API response (attempt $i/$MAX_ATTEMPTS)"
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done
          if [ -z "$upstream_version" ]; then
            echo "::error::Failed to resolve the latest stable OpenClaw version after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          upstream_image="ghcr.io/openclaw/openclaw:${upstream_version}"
          echo "  Final upstream_version=$upstream_version"
          echo "  Stable upstream image=$upstream_image"
          echo "::endgroup::"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "OUTPUT upstream_version=$upstream_version"

          echo "::group::Pull stable image manifest and extract digest"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "  [attempt $i/$MAX_ATTEMPTS] docker pull ${upstream_image} --platform linux/amd64 ..."
            PULL_OUTPUT=$(docker pull "${upstream_image}" --platform linux/amd64 -q 2>&1) || {
              echo "  WARNING: docker pull exited with code $?"
              echo "  Pull output: $PULL_OUTPUT"
              [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
              continue
            }
            echo "  Pull succeeded, extracting digest from RepoDigests..."
            current_digest=$(docker image inspect "${upstream_image}" --format '{{index .RepoDigests 0}}' 2>&1 | awk -F'@' '{print $2}' || echo "")
            if [ -n "$current_digest" ]; then
              echo "  Digest obtained: ${current_digest:0:19}..."
              break
            fi
            echo "  WARNING: Digest extraction returned empty"
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done
          echo "::endgroup::"

          if [ -z "$current_digest" ]; then
            echo "::error::Failed to fetch the stable upstream digest after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          echo "current_digest=$current_digest" >> "$GITHUB_OUTPUT"
          echo "OUTPUT current_digest=${current_digest:0:19}..."

      - name: Write current upstream state (unconditional)
        run: |
          echo "Writing current state to /tmp/upstream-state.json"
          echo "  digest:  ${{ steps.check.outputs.current_digest }}"
          echo "  version: ${{ steps.check.outputs.upstream_version }}"
          jq -n \
            --arg digest "${{ steps.check.outputs.current_digest }}" \
            --arg version "${{ steps.check.outputs.upstream_version }}" \
            '{digest: $digest, version: $version}' \
            > /tmp/upstream-state.json
          echo "Written: $(cat /tmp/upstream-state.json)"

      - name: Restore cached upstream state
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state

      - name: Decide whether to proceed
        id: decide
        run: |
          echo "::group::Decision logic"
          current_digest="${{ steps.check.outputs.current_digest }}"
          force="${{ github.event.inputs.force_release == 'true' && 'true' || 'false' }}"

          echo "  Current digest: ${current_digest:0:19}..."
          echo "  Force release:  $force"

          # Check if cache file exists (restored or written unconditionally)
          if [ -f /tmp/upstream-state.json ]; then
            cached_digest=$(jq -r '.digest' /tmp/upstream-state.json)
            cached_version=$(jq -r '.version' /tmp/upstream-state.json)
            echo "  Cache file found:"
            echo "    cached_digest:  ${cached_digest:0:19}..."
            echo "    cached_version: $cached_version"
          else
            cached_digest=""
            cached_version=""
            echo "  Cache file NOT found (first run or cache restore missed)"
          fi

          # Force release -> always proceed
          if [ "$force" = "true" ]; then
            echo "  Decision: FORCE RELEASE (manual override)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=force" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          # First run (no cache) -> proceed
          if [ -z "$cached_digest" ]; then
            echo "  Decision: FIRST RUN - proceeding with initial release"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=first_run" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          # Compare digests
          if [ "$current_digest" = "$cached_digest" ]; then
            echo "  Decision: UNCHANGED - upstream digest matches cached value"
            echo "  No release needed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "  Decision: UPDATED - upstream digest has changed"
            echo "  Old: ${cached_digest:0:19}..."
            echo "  New: ${current_digest:0:19}..."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=updated" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Determine next version
        id: version
        if: steps.decide.outputs.proceed == 'true'
        run: |
          echo "::group::Determine next version"
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "  No existing tags found, starting from v0.0.0"
            latest_tag="v0.0.0"
          else
            echo "  Latest tag: $latest_tag"
          fi
          major=$(echo "$latest_tag" | cut -d. -f1 | tr -d v)
          minor=$(echo "$latest_tag" | cut -d. -f2)
          patch=$(echo "$latest_tag" | cut -d. -f3)
          new_patch=$((patch + 1))
          echo "  Next version: v${major}.${minor}.${new_patch}"
          echo "version=v${major}.${minor}.${new_patch}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Set up QEMU
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.decide.outputs.proceed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:openclaw-${{ steps.check.outputs.upstream_version }}
          build-args: |
            OPENCLAW_IMAGE=ghcr.io/openclaw/openclaw@${{ steps.check.outputs.current_digest }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            openclaw.version=${{ steps.check.outputs.upstream_version }}
            openclaw.digest=${{ steps.check.outputs.current_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: steps.decide.outputs.proceed == 'true'
        run: |
          echo "::group::Create git tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.version }}"
          echo "  Tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists"
            exit 1
          fi
          git tag "$TAG"
          echo "  Local tag created, pushing to origin..."
          git push origin "$TAG"
          echo "  Tag pushed successfully"
          echo "::endgroup::"

      - name: Create GitHub Release
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Create GitHub Release"
          VERSION="${{ steps.version.outputs.version }}"
          UPSTREAM="${{ steps.check.outputs.upstream_version }}"
          DIGEST="${{ steps.check.outputs.current_digest }}"
          PREV_VERSION="${{ steps.decide.outputs.prev_version }}"
          PREV_DIGEST="${{ steps.decide.outputs.prev_digest }}"
          REASON="${{ steps.decide.outputs.reason }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'auto' }}"

          echo "  Version: $VERSION"
          echo "  Reason:  $REASON"

          SHORT_DIGEST=$(echo "$DIGEST" | head -c 19)
          SHORT_PREV=$(echo "$PREV_DIGEST" | head -c 19)

          # Build release notes into a temp file (avoids YAML multi-line string issues)
          NOTES_FILE=$(mktemp)

          if [ "$REASON" = "updated" ]; then
            echo "  Type: upstream updated"
            echo "## What's Changed" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            if [ -n "$PREV_VERSION" ]; then
              echo "**OpenClaw upstream updated** \`${PREV_VERSION}\` -> \`${UPSTREAM}\`" >> "$NOTES_FILE"
              echo "  Digest: \`${SHORT_PREV}...\` -> \`${SHORT_DIGEST}...\`" >> "$NOTES_FILE"
            else
              echo "**OpenClaw upstream updated** -> \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)" >> "$NOTES_FILE"
            fi
            echo "" >> "$NOTES_FILE"
            echo "**Clawkit image** \`${VERSION}\` based on \`ghcr.io/openclaw/openclaw:${UPSTREAM}\`" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "_Auto-generated by clawkit release workflow_" >> "$NOTES_FILE"

          elif [ "$REASON" = "first_run" ]; then
            echo "  Type: initial release"
            echo "## What's Changed" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "**Initial clawkit release** based on OpenClaw \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "**Clawkit image** \`${VERSION}\` with Linuxbrew + development tools" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "_Auto-generated by clawkit release workflow_" >> "$NOTES_FILE"

          else
            echo "  Type: manual force ($RELEASE_TYPE)"
            echo "## What's Changed" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            case "$RELEASE_TYPE" in
              code_update)
                echo "**Clawkit code update** -- \`${VERSION}\`" >> "$NOTES_FILE"
                echo "  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)" >> "$NOTES_FILE"
                ;;
              emergency)
                echo "**Emergency release** -- \`${VERSION}\`" >> "$NOTES_FILE"
                echo "  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)" >> "$NOTES_FILE"
                ;;
              *)
                echo "**Manual force release** -- \`${VERSION}\`" >> "$NOTES_FILE"
                echo "  - OpenClaw upstream: \`${UPSTREAM}\` (digest: \`${SHORT_DIGEST}...\`)" >> "$NOTES_FILE"
                echo "  - No upstream change detected -- release was forced" >> "$NOTES_FILE"
                ;;
            esac
            echo "" >> "$NOTES_FILE"
            echo "_Triggered manually | Auto-generated by clawkit release workflow_" >> "$NOTES_FILE"
          fi

          echo "  Creating release on GitHub..."
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "  Release created"
          echo "::endgroup::"

      - name: Save upstream state to cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/upstream-state.json
          key: last-upstream-state
      - name: Log cached state
        if: steps.decide.outputs.proceed == 'true'
        run: |
          echo "::group::Save upstream state to cache"
          echo "  Caching /tmp/upstream-state.json as 'last-upstream-state'"
          echo "  Contents: $(cat /tmp/upstream-state.json 2>/dev/null || echo 'file not found')"
          echo "::endgroup::"
